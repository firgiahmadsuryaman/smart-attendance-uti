{% extends 'base.html' %}
{% set page_description = "Perbarui informasi katalog mata kuliah. Perubahan akan digunakan oleh semua kelas yang memakai katalog ini." %}
{% block content %}
<div class="page-intro"><a class="btn btn-light" href="{{ url_for('admin.courses') }}"><i class="bi bi-arrow-left me-1"></i>Kembali</a></div>
<div class="panel"><div class="panel-body form-panel" style="max-width:900px"><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="field-grid"><div><label class="form-label">Kode mata kuliah</label><input class="form-control" name="code" value="{{ course.code }}" required></div><div><label class="form-label">Nama mata kuliah</label><input class="form-control" name="name" value="{{ course.name }}" required></div><div><label class="form-label">SKS</label><input class="form-control" name="credits" type="number" min="1" max="6" value="{{ course.credits }}" required></div><div><label class="form-label">Jenis mata kuliah (W/P)</label><select class="form-select" name="course_type"><option value="W" {% if course.course_type == 'W' %}selected{% endif %}>Wajib (W)</option><option value="P" {% if course.course_type == 'P' %}selected{% endif %}>Pilihan (P)</option></select></div><div><label class="form-label">Semester rekomendasi</label><select class="form-select" name="recommended_semester"><option value="">Belum ditentukan</option>{% for sem in range(1,9) %}<option value="{{ sem }}" {% if course.recommended_semester == sem %}selected{% endif %}>Semester {{ sem }}</option>{% endfor %}</select></div><div><label class="form-label">Program studi</label><select class="form-select" name="program_id" required>{% for p in programs %}<option value="{{ p.id }}" {% if p.id == course.program_id %}selected{% endif %}>{{ p.name }} ({{ p.code }})</option>{% endfor %}</select></div><div class="full"><label class="form-label">Deskripsi</label><textarea class="form-control" name="description" rows="3">{{ course.description or '' }}</textarea></div></div><button class="btn btn-primary mt-4"><i class="bi bi-check2-circle me-1"></i>Simpan perubahan</button></form></div></div>
{% endblock %}
