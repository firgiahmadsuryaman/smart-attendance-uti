{% extends 'base.html' %}
{% set page_description = ('Mahasiswa' if user.role=='student' else 'Dosen') ~ " · Perbarui data akun. Password baru bersifat opsional dan harus berisi minimal 8 karakter." %}
{% block content %}
<div class="page-intro"><a class="btn btn-light" href="{{ url_for('admin.students' if user.role=='student' else 'admin.lecturers') }}"><i class="bi bi-arrow-left me-1"></i>Kembali</a></div>
<div class="panel"><div class="panel-body form-panel" style="max-width:850px"><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="field-grid"><div><label class="form-label">Nama lengkap</label><input class="form-control" name="full_name" value="{{ user.full_name }}" required></div><div><label class="form-label">Email</label><input class="form-control" type="email" name="email" value="{{ user.email }}" required></div>{% if user.role=='student' %}<div><label class="form-label">NPM</label><input class="form-control" name="npm" value="{{ user.npm or '' }}" required></div><div><label class="form-label">Program studi</label><select class="form-select" name="program_id" required>{% for p in programs %}<option value="{{ p.id }}" {% if user.program_id==p.id %}selected{% endif %}>{{ p.name }}</option>{% endfor %}</select></div><div><label class="form-label">Angkatan</label><input class="form-control" name="cohort" value="{{ user.cohort or '' }}"></div>{% else %}<div><label class="form-label">ID Dosen</label><input class="form-control" name="employee_id" value="{{ user.employee_id or '' }}"></div>{% endif %}<div class="full"><label class="form-label">Password baru <span class="muted fw-normal">(kosongkan jika tidak diubah)</span></label><input class="form-control" type="password" name="new_password" minlength="8" autocomplete="new-password"></div></div><button class="btn btn-primary mt-4">Simpan perubahan</button></form></div></div>{% endblock %}
